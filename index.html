    <script>
      // Preload the background painting for the saved theme (it is the LCP element)
      (function () {
        var dark = false;
        try { dark = localStorage.getItem('portfolio-dark') === 'true'; } catch (e) {}
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp';
        l.href = '%BASE_URL%images/' + (dark ? 'starry-night' : 'flowers') + '.webp';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      })();
    </script>
